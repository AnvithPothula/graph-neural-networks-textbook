# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Graph Neural Networks'
site_description: 'A comprehensive intelligent textbook on Graph Neural Networks — from graph theory to foundation models, exceeding Stanford CS224W in depth, coverage, and interactivity.'
site_author: 'Anvith Pothula'
site_url: 'https://AnvithPothula.github.io/graph-neural-networks-textbook/'

# Hooks — runs local Python before/after page processing.
# `plugins/social_override.py` injects og:title, og:description, og:image,
# og:type, og:url, and twitter:* meta tags on every page using each page's
# frontmatter `title:` / `description:` / `image:` (falling back to the site-
# wide values and `img/cover.png`). This is the Cairo-free path to social-
# media previews — works without `pip install "mkdocs-material[imaging]"`.
# If the `social` plugin below is ever enabled, the same hook also rewrites
# its auto-generated `/assets/images/social/...` URLs to point at the
# declared cover image. Verify the result with `bk-check-social-cover`.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/AnvithPothula/graph-neural-networks-textbook'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Anvith Pothula. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - "0. Math and Programming Prerequisites": chapters/00-math-prerequisites/index.md
      - "1. Introduction to Graphs and Networks": chapters/01-intro-to-graphs/index.md
      - "2. Graph Properties and Traditional ML Features": chapters/02-graph-properties-and-features/index.md
      - "3. Link Analysis and PageRank": chapters/03-link-analysis-pagerank/index.md
      - "4. Node Embeddings: DeepWalk and node2vec": chapters/04-node-embeddings/index.md
      - "5. Label Propagation and Semi-Supervised Learning": chapters/05-label-propagation/index.md
      - "6. GNN Foundations: Message Passing and GCN": chapters/06-gnn-foundations/index.md
      - "7. GNN Design Space: GraphSAGE and GAT": chapters/07-gnn-design-space/index.md
      - "8. GNN Training, Augmentation, and Practical Tips": chapters/08-gnn-training/index.md
      - "9. Theory of GNNs: Expressiveness and the WL Test": chapters/09-gnn-theory/index.md
      - "10. Designing Powerful Encoders: GIN and Beyond": chapters/10-powerful-gnns/index.md
      - "11. Graph Transformers": chapters/11-graph-transformers/index.md
      - "12. Knowledge Graph Embeddings": chapters/12-knowledge-graph-embeddings/index.md
      - "13. Reasoning over Knowledge Graphs": chapters/13-kg-reasoning/index.md
      - "14. Knowledge Graph Foundation Models": chapters/14-kg-foundation-models/index.md
      - "15. Heterogeneous Graphs": chapters/15-heterogeneous-graphs/index.md
      - "16. GNNs for Recommender Systems": chapters/16-recommender-systems/index.md
      - "17. Relational Deep Learning": chapters/17-relational-deep-learning/index.md
      - "18. Community Structure in Networks": chapters/18-community-structure/index.md
      - "19. Frequent Subgraph Mining": chapters/19-subgraph-mining/index.md
      - "20. Scaling GNNs to Billion-Node Graphs": chapters/20-scaling-gnns/index.md
      - "21. Deep Generative Models for Graphs": chapters/21-generative-models/index.md
      - "22. Temporal and Dynamic Graphs": chapters/22-temporal-graphs/index.md
      - "23. LLMs and GNNs: Text-Attributed Graphs and Joint Training": chapters/23-llm-gnn/index.md
      - "24. Advanced GNN Topics: In-Context Learning and Uncertainty": chapters/24-advanced-gnn-topics/index.md
      - "25. Agents and Graphs": chapters/25-agents-and-graphs/index.md
      - "26. Conclusion: The GNN Design Space and Open Problems": chapters/26-conclusion/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Concept List: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Metrics: learning-graph/quality-metrics.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Mascot Style Guide: learning-graph/mascot-test.md

  - MicroSims:
      - List of MicroSims: sims/index.md
      - Learning Graph Viewer: sims/graph-viewer/index.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  logo: img/mascot/neutral.png
  favicon: img/favicon.ico
  palette:
    primary: 'indigo'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
      skip_classes:
        - mascot-admonition-img   # keep mascot poses out of the lightbox gallery
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Custom CSS
extra_css:
  - css/extra.css
  - css/mascot.css

# Custom JavaScript
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md
  **/character-sheet.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Graph Neural Networks'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
